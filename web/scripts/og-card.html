<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<style>
			@font-face {
				font-family: Geist;
				src: url('../node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2')
					format('woff2-variations');
				font-weight: 100 900;
			}
			* {
				box-sizing: border-box;
				margin: 0;
			}
			html,
			body {
				width: 1200px;
				height: 630px;
			}
			body {
				font-family:
					Geist,
					-apple-system,
					BlinkMacSystemFont,
					sans-serif;
				background: #0a0a0b;
				color: #fafafa;
				overflow: hidden;
			}
			.card {
				position: relative;
				width: 100%;
				height: 100%;
				padding: 72px 76px 64px;
				display: flex;
				flex-direction: column;
				justify-content: space-between;
				background:
					radial-gradient(
						900px 520px at 88% -12%,
						rgba(34, 197, 94, 0.2),
						transparent 60%
					),
					radial-gradient(
						700px 480px at -8% 110%,
						rgba(59, 130, 246, 0.16),
						transparent 62%
					);
			}
			.brand {
				display: flex;
				align-items: baseline;
				gap: 14px;
				font-size: 34px;
				letter-spacing: -0.03em;
			}
			.brand b {
				font-weight: 650;
			}
			.brand span {
				color: #a1a1aa;
				font-weight: 420;
			}
			.pill {
				margin-left: auto;
				font-size: 16px;
				font-weight: 500;
				color: #86efac;
				background: rgba(34, 197, 94, 0.12);
				border: 1px solid rgba(34, 197, 94, 0.32);
				border-radius: 999px;
				padding: 8px 16px;
			}
			h1 {
				font-size: 74px;
				line-height: 1.04;
				letter-spacing: -0.045em;
				font-weight: 600;
				max-width: 940px;
			}
			h1 em {
				font-style: normal;
				color: #4ade80;
			}
			p {
				margin-top: 22px;
				font-size: 25px;
				line-height: 1.45;
				color: #a1a1aa;
				max-width: 820px;
				font-weight: 420;
			}
			.bottom {
				display: flex;
				align-items: flex-end;
				gap: 40px;
			}
			.bars {
				display: flex;
				gap: 3px;
				align-items: flex-end;
				height: 58px;
				flex: 1;
			}
			.bars i {
				flex: 1;
				border-radius: 2px;
				background: #22c55e;
				opacity: 0.85;
			}
			.meta {
				font-size: 18px;
				color: #71717a;
				white-space: nowrap;
				padding-bottom: 4px;
			}
		</style>
	</head>
	<body>
		<div class="card">
			<div class="brand">
				<b>o1</b><span>uptime</span
				><span class="pill">All systems operational</span>
			</div>
			<div>
				<h1>Know your services are up<br />before your <em>users</em> do.</h1>
				<p>
					SSRF-guarded probing, multi-channel alerts, public status pages, and
					an audit trail — Go, PostgreSQL, React.
				</p>
			</div>
			<div class="bottom">
				<div class="bars" id="bars"></div>
				<div class="meta">o1.work.gd</div>
			</div>
		</div>
		<script>
			const bars = document.getElementById('bars');
			// 90 daily bars: a few degraded days, one outage, the rest healthy.
			const degraded = new Set([8, 9, 27, 33, 34, 35, 58, 71]);
			const down = 47;
			for (let day = 0; day < 90; day += 1) {
				const bar = document.createElement('i');
				const height = 40 + ((day * 37) % 19);
				bar.style.height = `${height}px`;
				if (degraded.has(day)) {
					bar.style.height = '28px';
					bar.style.background = '#f59e0b';
				}
				if (day === down) {
					bar.style.height = '16px';
					bar.style.background = '#ef4444';
				}
				bars.appendChild(bar);
			}
		</script>
	</body>
</html>
