<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>o1 — uptime and incident monitoring</title>
		<meta
			name="description"
			content="o1 monitors uptime and incidents for small teams: SSRF-guarded probes, multi-channel alerts, public status pages, and an audit trail."
		/>
		<meta
			name="theme-color"
			content="#0a0a0b"
			media="(prefers-color-scheme: dark)"
		/>
		<meta
			name="theme-color"
			content="#ffffff"
			media="(prefers-color-scheme: light)"
		/>
		<!-- Canonical deployment used for link previews. Update both values if the
		app moves to another origin. -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="o1 uptime" />
		<meta property="og:title" content="o1 — uptime and incident monitoring" />
		<meta
			property="og:description"
			content="Probing, alerting, public status pages, and audit trails for small teams. Self-hosted Go and PostgreSQL behind a React dashboard."
		/>
		<meta property="og:url" content="https://o1.work.gd/" />
		<meta property="og:image" content="https://o1.work.gd/og.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta
			property="og:image:alt"
			content="o1 uptime — uptime and incident monitoring for small teams"
		/>
		<meta name="twitter:card" content="summary_large_image" />
		<script>
			(function () {
				try {
					var key = 'o1-theme';
					var valid = ['light', 'dark', 'system'];
					var stored = localStorage.getItem(key);
					if (stored !== null && valid.indexOf(stored) === -1) {
						localStorage.removeItem(key);
						stored = null;
					}
					var dark =
						stored === 'dark' ||
						(stored !== 'light' &&
							window.matchMedia('(prefers-color-scheme: dark)').matches);
					document.documentElement.classList.toggle('dark', dark);
					document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
				} catch (error) {
					// localStorage can be unavailable; fall back to the light tokens.
				}
			})();
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
