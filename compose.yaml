services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: o1
      POSTGRES_PASSWORD: o1
      POSTGRES_DB: o1
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U o1 -d o1"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build:
      context: ./backend
    entrypoint: ["/api"]
    depends_on:
      postgres:
        condition: service_healthy
    environment: &backend-env
      O1_ENV: development
      O1_DATABASE_URL: postgres://o1:o1@postgres:5432/o1?sslmode=disable
      # Development-only key. Override O1_SECRET_KEY and O1_ENCRYPTION_KEY in
      # production; see README.md.
      O1_SECRET_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      O1_EMAIL_FROM: ${O1_EMAIL_FROM:-o1@localhost}
      O1_APP_BASE_URL: http://localhost:5173
      O1_ALLOWED_ORIGINS: ${O1_ALLOWED_ORIGINS:-}
      # Compose only passes .env values into containers when they are
      # referenced here. Required for the admin bootstrap at startup.
      O1_BOOTSTRAP_ADMIN_EMAIL: ${O1_BOOTSTRAP_ADMIN_EMAIL:-}
      # Observability is optional: empty OTLP/Sentry values disable tracing and
      # error reporting. The API's metrics/health listener on :8083 is internal
      # and is deliberately not published to the host.
      O1_API_HEALTH_ADDR: ${O1_API_HEALTH_ADDR:-:8083}
      O1_OTEL_EXPORTER_OTLP_ENDPOINT: ${O1_OTEL_EXPORTER_OTLP_ENDPOINT:-}
      O1_OTEL_EXPORTER_OTLP_HEADERS: ${O1_OTEL_EXPORTER_OTLP_HEADERS:-}
      O1_OTEL_SAMPLE_RATIO: ${O1_OTEL_SAMPLE_RATIO:-}
      O1_SENTRY_DSN: ${O1_SENTRY_DSN:-}
      O1_SENTRY_ENVIRONMENT: ${O1_SENTRY_ENVIRONMENT:-}
      O1_RELEASE: ${O1_RELEASE:-dev}
      # The credential endpoints are rate limited per client IP. Raise the
      # default 10/min (burst 10) so local signup, 2FA, and E2E flows are not
      # throttled. Production should leave these unset to keep the defaults.
      O1_AUTH_RATE_PER_MINUTE: ${O1_AUTH_RATE_PER_MINUTE:-120}
      O1_AUTH_RATE_BURST: ${O1_AUTH_RATE_BURST:-60}
      # Data lifecycle. The scheduler owns rollups and retention; retention is
      # a dry run until O1_RETENTION_DRY_RUN is set to false.
      O1_RAW_RETENTION_DAYS: ${O1_RAW_RETENTION_DAYS:-90}
      O1_ROLLUP_RETENTION_MONTHS: ${O1_ROLLUP_RETENTION_MONTHS:-13}
      O1_AUDIT_RETENTION_MONTHS: ${O1_AUDIT_RETENTION_MONTHS:-12}
      O1_RETENTION_DRY_RUN: ${O1_RETENTION_DRY_RUN:-true}
      O1_RETENTION_MAX_PARTITION_DROPS: ${O1_RETENTION_MAX_PARTITION_DROPS:-1}
      O1_ROLLUP_INTERVAL: ${O1_ROLLUP_INTERVAL:-15m}
      O1_ROLLUP_MAX_HOURS_PER_RUN: ${O1_ROLLUP_MAX_HOURS_PER_RUN:-24}
      O1_EMAIL_PROVIDER: ${O1_EMAIL_PROVIDER:-mailpit}
      O1_SMTP_ADDR: ${O1_SMTP_ADDR:-mailpit:1025}
      O1_SMTP_USERNAME: ${O1_SMTP_USERNAME:-}
      O1_SMTP_PASSWORD: ${O1_SMTP_PASSWORD:-}
      O1_SMTP_TLS: ${O1_SMTP_TLS:-starttls}
    ports:
      - "8080:8080"

  web:
    build:
      context: ./web
      args:
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_RELEASE: ${VITE_RELEASE:-dev}
    depends_on:
      - api
    environment:
      # Development listens on plain HTTP on :80. Production sets the domain so
      # Caddy obtains and serves a TLS certificate.
      O1_SITE_ADDRESS: ":80"
    ports:
      - "5173:80"

  scheduler:
    build:
      context: ./backend
    entrypoint: ["/scheduler"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *backend-env
      O1_SCHEDULER_HEALTH_ADDR: ":8081"
    # Health/metrics listener on loopback only.
    ports:
      - "127.0.0.1:8081:8081"

  worker:
    build:
      context: ./backend
    entrypoint: ["/worker"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *backend-env
      O1_WORKER_HEALTH_ADDR: ":8082"
    # Health/metrics listener on loopback only.
    ports:
      - "127.0.0.1:8082:8082"

  # Optional scrape/remote-write agent for Grafana Cloud. It is not started by
  # `docker compose up`; use `docker compose --profile observability up -d`.
  # The guard exits with a readable error instead of silently remote-writing
  # with empty credentials. The config lives in deploy/observability/.
  alloy:
    image: grafana/alloy:v1.21.3
    profiles: ["observability"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for name in GRAFANA_REMOTE_WRITE_URL GRAFANA_REMOTE_WRITE_USER GRAFANA_REMOTE_WRITE_TOKEN \
                    GRAFANA_LOKI_URL GRAFANA_LOKI_USER GRAFANA_LOKI_TOKEN; do
          if [ -z "$$(printenv "$$name")" ]; then
            echo "alloy: required environment variable $$name is not set; set GRAFANA_REMOTE_WRITE_URL, GRAFANA_REMOTE_WRITE_USER, GRAFANA_REMOTE_WRITE_TOKEN, GRAFANA_LOKI_URL, GRAFANA_LOKI_USER, and GRAFANA_LOKI_TOKEN before starting the observability profile" >&2
            exit 1
          fi
        done
        exec /bin/alloy run /etc/alloy/config.alloy \
          --server.http.listen-addr=0.0.0.0:12345 \
          --storage.path=/var/lib/alloy/data
    environment:
      O1_ENV: ${O1_ENV:-development}
      O1_COMPOSE_PROJECT: ${O1_COMPOSE_PROJECT:-o1}
      GRAFANA_REMOTE_WRITE_URL: ${GRAFANA_REMOTE_WRITE_URL:-}
      GRAFANA_REMOTE_WRITE_USER: ${GRAFANA_REMOTE_WRITE_USER:-}
      GRAFANA_REMOTE_WRITE_TOKEN: ${GRAFANA_REMOTE_WRITE_TOKEN:-}
      GRAFANA_LOKI_URL: ${GRAFANA_LOKI_URL:-}
      GRAFANA_LOKI_USER: ${GRAFANA_LOKI_USER:-}
      GRAFANA_LOKI_TOKEN: ${GRAFANA_LOKI_TOKEN:-}
    volumes:
      - ./deploy/observability/alloy.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - api
      - scheduler
      - worker
    restart: "no"

volumes:
  postgres-data:
