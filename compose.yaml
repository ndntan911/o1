services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: o1
      POSTGRES_PASSWORD: o1
      POSTGRES_DB: o1
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U o1 -d o1"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build:
      context: ./backend
    entrypoint: ["/api"]
    depends_on:
      postgres:
        condition: service_healthy
    environment: &backend-env
      O1_ENV: development
      O1_DATABASE_URL: postgres://o1:o1@postgres:5432/o1?sslmode=disable
      # Development-only key. Override O1_SECRET_KEY and O1_ENCRYPTION_KEY in
      # production; see README.md.
      O1_SECRET_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      O1_SMTP_ADDR: mailpit:1025
      O1_EMAIL_FROM: o1@localhost
      O1_APP_BASE_URL: http://localhost:5173
      O1_ALLOWED_ORIGINS: ${O1_ALLOWED_ORIGINS:-}
      # Compose only passes .env values into containers when they are
      # referenced here. Required for the admin bootstrap at startup.
      O1_BOOTSTRAP_ADMIN_EMAIL: ${O1_BOOTSTRAP_ADMIN_EMAIL:-}
    ports:
      - "8080:8080"

  web:
    build:
      context: ./web
      args:
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_RELEASE: ${VITE_RELEASE:-dev}
    depends_on:
      - api
    ports:
      - "5173:80"

  scheduler:
    build:
      context: ./backend
    entrypoint: ["/scheduler"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *backend-env
      O1_SCHEDULER_HEALTH_ADDR: ":8081"
    ports:
      - "8081:8081"

  worker:
    build:
      context: ./backend
    entrypoint: ["/worker"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *backend-env
      O1_WORKER_HEALTH_ADDR: ":8082"
    ports:
      - "8082:8082"

volumes:
  postgres-data:
