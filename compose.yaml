services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: o1
      POSTGRES_PASSWORD: o1
      POSTGRES_DB: o1
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U o1 -d o1"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres-data:
