name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: backend/go.sum

      - name: go vet
        run: go vet ./...

      - name: go test (short)
        run: go test -short ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          # Pinned to a release built with a Go toolchain new enough for this
          # module's `go 1.26.0` directive; older versions (e.g. v2.1.6) fail
          # to load the module.
          version: v2.11.4
          working-directory: backend

      - name: Build all binaries
        run: go build ./...

      - name: Build multi-binary image
        run: docker build -t o1-backend:ci -f Dockerfile .

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: backend/go.sum

      # The GitHub-hosted runner provides Docker, so testcontainers can start
      # Postgres for the integration tests.
      - name: go test (integration)
        run: go test -count=1 ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
      - run: docker build -t o1-web:ci .

  e2e:
    runs-on: ubuntu-latest
    needs: frontend
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: docker compose up -d --build
      - name: Wait for the stack
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:5173 >/dev/null && \
              curl -fsS http://localhost:8080/readyz >/dev/null && exit 0
            sleep 2
          done
          docker compose logs
          exit 1
      - run: npx playwright test
        working-directory: web
      - if: always()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
