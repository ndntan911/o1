name: Deploy
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, production]
        required: true
      version:
        description: "Release tag, for example v1.2.3"
        required: true
      dry_run:
        type: boolean
        default: false
permissions:
  contents: read
  packages: read
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}
          fetch-depth: 0
      - name: Validate release
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          VERSION: ${{ inputs.version }}
          WORKFLOW_REF: ${{ github.ref }}
        run: ./deploy/scripts/validate-release.sh "$ENVIRONMENT" "$VERSION" "$WORKFLOW_REF"
      - name: Verify tag is reachable from main
        if: inputs.environment == 'production'
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve digests and write bundle
        env:
          VERSION: ${{ inputs.version }}
          REPO_OWNER: ${{ github.repository_owner }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          owner=$(printf '%s' "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')
          registry="ghcr.io/$owner"
          backend_digest=$(docker buildx imagetools inspect "$registry/o1-backend:$VERSION" --format '{{.Manifest.Digest}}')
          web_digest=$(docker buildx imagetools inspect "$registry/o1-web:$VERSION" --format '{{.Manifest.Digest}}')
          release_id="$VERSION-$(git rev-parse --short=12 HEAD)-$RUN_ID-$RUN_ATTEMPT"
          mkdir -p "bundle/deploy/production" "bundle/deploy/observability"
          cp deploy/production/compose.yaml bundle/deploy/production/
          cp deploy/observability/alloy.alloy bundle/deploy/observability/
          printf 'O1_BACKEND_IMAGE=%s/o1-backend@%s\nO1_WEB_IMAGE=%s/o1-web@%s\n' \
            "$registry" "$backend_digest" "$registry" "$web_digest" > bundle/images.env
          {
            echo "BACKEND_IMAGE=$registry/o1-backend@$backend_digest"
            echo "WEB_IMAGE=$registry/o1-web@$web_digest"
            echo "RELEASE_ID=$release_id"
          } >> "$GITHUB_ENV"
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Install known hosts
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Upload bundle and deploy
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          ssh_opts=(-o BatchMode=yes -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          ssh -p "$SSH_PORT" "${ssh_opts[@]}" -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            "mkdir -p /opt/o1/incoming/$RELEASE_ID"
          scp -P "$SSH_PORT" "${ssh_opts[@]}" -r bundle/. "$SSH_USER@$SSH_HOST:/opt/o1/incoming/$RELEASE_ID/"
          flag=""
          if [[ "$DRY_RUN" == "true" ]]; then flag="--dry-run"; fi
          ssh -p "$SSH_PORT" "${ssh_opts[@]}" -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            "/opt/o1/bin/deploy.sh /opt/o1/incoming/$RELEASE_ID $flag"
      - name: Summarize deployment
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          VERSION: ${{ inputs.version }}
          RELEASE_ID: ${{ env.RELEASE_ID }}
        run: |
          {
            echo "### Deploy"
            echo "- environment: \`$ENVIRONMENT\`"
            echo "- version: \`$VERSION\`"
            echo "- release: \`$RELEASE_ID\`"
            echo "- backend: \`$BACKEND_IMAGE\`"
            echo "- web: \`$WEB_IMAGE\`"
          } >> "$GITHUB_STEP_SUMMARY"
